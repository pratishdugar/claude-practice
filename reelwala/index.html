<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reelwala</title>
<meta name="theme-color" content="#F5F3F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@700;800&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Montserrat:wght@800&family=Mukta:wght@700;800&family=Poppins:wght@600;800&display=swap">
<style>
/* Layout: one phone-width column, sticky top bar with project switcher, fixed bottom tab bar. Cards only for scenes, ideas and projects. */
:root{
  --bg:#F5F3F2; --surface:#FFFFFF; --sunk:#ECE8E6; --ink:#17151A; --muted:#6B6570; --line:#E2DDDA;
  --accent:#E8492A; --accent-ink:#FFFFFF; --soft:#FBE7E1; --good:#1F7A52; --warn:#9A6514; --bad:#B42318;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121014; --surface:#1C191F; --sunk:#262229; --ink:#F3EFF1; --muted:#A59DA8; --line:#322C35;
    --accent:#FF6A48; --accent-ink:#1A0D09; --soft:#3A1E17; --good:#5CC995; --warn:#E3B05C; --bad:#FF8A80; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;white-space:nowrap}
.rec{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.top select{margin-left:auto;max-width:56%;min-width:0}
main .wrap{padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
.lead{color:var(--muted);margin:4px 0 0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;min-height:42px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f .hint{font-weight:400;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:baseline;gap:10px}
.step .n{font:500 12px/1 var(--mono);color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:4px 6px}
.chip{font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--muted);white-space:nowrap}
.chip.hot{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--sunk)}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.msg.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.sec-h{font:700 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:10px;padding-top:14px;border-top:1px dashed var(--line)}
.sec-h:first-child{border-top:0;margin-top:0;padding-top:0}
.form{display:flex;flex-direction:column;gap:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14px}
.toggle input{width:44px;height:26px;appearance:none;background:var(--sunk);border:1px solid var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0003;transition:left .15s}
.toggle input:checked{background:var(--accent);border-color:var(--accent)}
.toggle input:checked::after{left:20px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:52px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}

/* projects */
.cards{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcard .stripe{height:6px}
.pcard .in{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pcard p{margin:0;color:var(--muted);font-size:14px}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.tpl button b{font-family:var(--display);font-size:16px}
.tpl button span{font-size:13px;color:var(--muted)}

/* media */
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.mi{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--sunk);max-width:100%}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mi .tag{position:absolute;left:5px;top:5px;font:500 10px/1 var(--mono);background:#000a;color:#fff;border-radius:4px;padding:3px 4px}
.mi .dur{position:absolute;left:5px;bottom:5px;font:500 10px/1 var(--mono);background:#000a;color:#fff;border-radius:4px;padding:3px 4px}
.mi .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer;font-size:15px;line-height:1}
.drop{border:1.5px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:var(--soft);color:var(--ink);font-weight:600}

/* scenes */
.scenes{display:flex;flex-direction:column;gap:10px}
.scene{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.scene .hd{display:flex;gap:10px;align-items:flex-start}
.scene .th{width:46px;flex:none;aspect-ratio:9/16;border-radius:7px;overflow:hidden;background:var(--sunk)}
.scene .th img{width:100%;height:100%;object-fit:cover;display:block}
.scene .meta{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.scene .meta label{font:500 10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.scene .meta select,.scene .meta input{min-height:34px;padding:5px 7px;font:14px var(--body)}
.scene .tc{font:500 12px/1 var(--mono);color:var(--accent)}
.scene textarea{min-height:56px}
.scene .ops{display:flex;gap:4px;margin-left:auto}
.iconb{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.total{font:500 13px/1 var(--mono)}

/* preview */
.stage{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.screen{width:min(100%,300px);aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen canvas,.screen video{width:100%;height:100%;display:block}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.tcbig{font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums}

/* ideas */
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.idea .hook{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25}
.idea ol,.idea ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.idea details summary{cursor:pointer;font-weight:600;font-size:14px}
.idea .vo{white-space:pre-wrap;font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:6px}
.star{color:var(--accent)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prompter{font-size:20px;line-height:1.45;background:var(--sunk);border-radius:12px;padding:14px;max-height:220px;overflow:auto;white-space:pre-wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.btn{transition:none}}
a{color:var(--accent)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
code{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo"><span class="rec" aria-hidden="true"></span>Reelwala</div>
  <select id="projSel" aria-label="Current project"></select>
</div></header>

<main>
<section id="v-projects"><div class="wrap" id="projectsBox"></div></section>
<section id="v-setup" hidden><div class="wrap" id="setupBox"></div></section>
<section id="v-ideas" hidden><div class="wrap" id="ideasBox"></div></section>
<section id="v-create" hidden><div class="wrap" id="createBox"></div></section>
<section id="v-settings" hidden><div class="wrap" id="settingsBox"></div></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button class="tab" data-go="projects"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l2 5M14 4l2 5"/></svg>Projects</button>
  <button class="tab" data-go="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>Ideas</button>
  <button class="tab" data-go="create"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z"/></svg>Create</button>
  <button class="tab" data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
"use strict";
/* ============ constants ============ */
const BASE = "https://generativelanguage.googleapis.com/v1beta";
const STRUCTURES = {
  hook:["Hook → Build → Payoff","Open with the most surprising moment as a hook. Set up the situation in one line. Build with 2–4 escalating moments. Land the payoff or punchline. End with a question or call to action."],
  versus:["Versus / Challenge","Cold open on the most dramatic moment. Introduce the competitors and the challenge rules. Round-by-round highlights with a running score. A twist, blunder or comeback. Final result and the winner's reaction. Tease next week's challenge."],
  beforeafter:["Before → After","Flash the end result for 1 second as a hook. Cut to the 'before'. Show 3–5 quick steps of the process. Reveal the full 'after'. End with the key tip."],
  countdown:["Top N countdown","Hook stating what the list is. Count down from N to 1, one item per scene with a one-line reason. Number 1 gets the longest scene. End by asking viewers for their pick."],
  dayinlife:["Day in the life","Hook with the most interesting moment of the day. Then go chronological: morning, main activity, a funny or real moment, evening wind-down. Close with one reflection line."],
  tutorial:["How-to / Tutorial","Hook with the result and a promise (\"do this in 30 seconds\"). Steps 1–N, one per scene, each with a clear caption. One common mistake to avoid. Final result. Ask viewers to save the reel."],
  travel:["Travel diary","Hook with the best view. Arrival moment. 3–4 highlights, each with one interesting fact or tip. A food moment. Closing reflection plus one practical tip (cost, timing or route)."],
  review:["Review / Verdict","Hook with the money shot and a bold claim. Where it is and how much it costs. Reactions to each item tried. Honest pros and cons. Score out of 10. Call to action."]
};
const TONES = ["Energetic & funny banter","Hype & intense","Cinematic & dreamy","Fun & honest","Relaxed & personal","Inspirational","Informative & crisp","Dramatic & suspenseful","Sarcastic & witty"];
const LANGS = ["English (India)","English (US)","Hindi","Hinglish (Hindi + English mix)","Marathi","Gujarati","Bengali","Punjabi","Tamil","Telugu","Kannada","Malayalam","Urdu","Spanish","French","Arabic","Indonesian","Japanese"];
const VOICES = [["Puck","Upbeat"],["Fenrir","Excitable"],["Zephyr","Bright"],["Kore","Firm"],["Charon","Informative"],["Leda","Youthful"],["Orus","Firm"],["Aoede","Breezy"],["Callirrhoe","Easy-going"],["Autonoe","Bright"],["Enceladus","Breathy"],["Iapetus","Clear"],["Umbriel","Easy-going"],["Algieba","Smooth"],["Despina","Smooth"],["Erinome","Clear"],["Algenib","Gravelly"],["Rasalgethi","Informative"],["Laomedeia","Upbeat"],["Achernar","Soft"],["Alnilam","Firm"],["Schedar","Even"],["Gacrux","Mature"],["Pulcherrima","Forward"],["Achird","Friendly"],["Zubenelgenubi","Casual"],["Vindemiatrix","Gentle"],["Sadachbia","Lively"],["Sadaltager","Knowledgeable"],["Sulafat","Warm"]];
const FONTS = [["Poppins","Poppins (Hindi + English)"],["Baloo 2","Baloo 2 (Hindi + English)"],["Mukta","Mukta (Hindi + English)"],["Anton","Anton (English only)"],["Bebas Neue","Bebas Neue (English only)"],["Montserrat","Montserrat (English only)"]];
const DEFAULTS = {
  name:"New project", kind:"reel", duration:30, pacing:"medium", about:"", audience:"",
  structureKey:"hook", structure:STRUCTURES.hook[1], tone:"Energetic & funny banter", extra:"",
  voMode:"ai", language:"English (India)", voice:"Puck", voStyle:"", voPace:"normal", syncVO:true, origVol:0.25, musicVol:0.35,
  captions:true, capLang:"same", capStyle:"bold", capAnim:"words", capCase:"normal", capPos:"bottom", font:"Poppins",
  capColor:"#FFFFFF", hiColor:"#FFD43B", transition:"punch", showHook:true, endCard:true, handle:"", cta:"Follow for more", brand:"#E8492A"
};
const TEMPLATES = [
  {label:"Sports challenge", blurb:"Two rivals, a new sport every week", p:{name:"Weekly Showdown", about:"Two friends compete against each other in a different sport every week.", audience:"Sports fans 16–35 who enjoy banter", structureKey:"versus", tone:"Energetic & funny banter", duration:45, pacing:"fast", voice:"Puck", voStyle:"hype sports commentator", font:"Anton", capCase:"upper", brand:"#E8492A"}},
  {label:"Travel diary", blurb:"Places, food and tips", p:{name:"Travel Diary", about:"Short travel films from my trips with practical tips.", audience:"Young travellers planning budget trips", structureKey:"travel", tone:"Cinematic & dreamy", duration:30, pacing:"medium", voice:"Aoede", voStyle:"warm storyteller", capStyle:"minimal", capAnim:"pop", transition:"fade", brand:"#1E7A8C"}},
  {label:"Food review", blurb:"Try it, rate it out of 10", p:{name:"Food Reviews", about:"Honest reviews of street food and restaurants.", audience:"Local foodies", structureKey:"review", tone:"Fun & honest", duration:30, pacing:"fast", voice:"Kore", voStyle:"friendly food critic", font:"Baloo 2", capStyle:"box", brand:"#C9821B"}},
  {label:"Day in my life", blurb:"A day, start to finish", p:{name:"Day in My Life", about:"Everyday moments from my life.", structureKey:"dayinlife", tone:"Relaxed & personal", duration:30, pacing:"medium", voice:"Sulafat", voStyle:"calm and personal", transition:"fade", brand:"#5B5FC7"}},
  {label:"Blank project", blurb:"Set everything yourself", p:{}}
];
const FIELDS = [
  ["h","Basics"],
  ["name","Project name","text"],
  ["kind","Format","select",[["reel","Reel (up to 90 s)"],["story","Story (up to 60 s)"]]],
  ["duration","Target length","select",[[15,"15 seconds"],[30,"30 seconds"],[45,"45 seconds"],[60,"60 seconds"],[90,"90 seconds"]]],
  ["pacing","Cut pacing","select",[["fast","Fast cuts (1–2 s)"],["medium","Medium (2–4 s)"],["slow","Slow and cinematic (4 s+)"]]],
  ["about","What is this series about?","textarea","e.g. Two friends compete in a different sport every week"],
  ["audience","Who is it for?","text","e.g. Cricket fans 18–30"],
  ["h","Story format"],
  ["structureKey","Story structure","preset"],
  ["structure","Structure the AI follows every time","textarea"],
  ["tone","Tone","select",TONES.map(t=>[t,t])],
  ["extra","Always remember","textarea","Rules for every reel, e.g. Call us “the bros”. No swear words. Mention the score in every round."],
  ["h","Voice-over"],
  ["voMode","Voice-over type","select",[["ai","AI voice (Gemini)"],["record","Record my own voice"],["upload","Upload an audio file"],["none","No voice-over, captions only"]]],
  ["language","Language","select",LANGS.map(l=>[l,l])],
  ["voice","AI voice","voice"],
  ["voStyle","Delivery style","text","e.g. hype cricket commentator, warm storyteller"],
  ["voPace","Speaking pace","select",[["slow","Slow"],["normal","Normal"],["fast","Fast"]]],
  ["syncVO","Fit scene lengths to the voice-over","toggle"],
  ["origVol","Original clip sound","range"],
  ["musicVol","Background music volume","range"],
  ["h","Captions and look"],
  ["captions","Show captions","toggle"],
  ["capLang","Caption language","select",[["same","Same as voice-over"],["English","English"],["roman","Roman script (Hinglish style)"]]],
  ["capStyle","Caption style","select",[["bold","Bold outline"],["box","Dark box"],["minimal","Minimal shadow"]]],
  ["capAnim","Caption animation","select",[["words","Word by word"],["pop","Pop in"],["static","Static"]]],
  ["capCase","Letter case","select",[["normal","As written"],["upper","UPPERCASE"]]],
  ["capPos","Caption position","select",[["top","Upper"],["middle","Middle"],["bottom","Lower third"]]],
  ["font","Caption font","select",FONTS],
  ["capColor","Caption colour","color"],
  ["hiColor","Highlight colour","color"],
  ["transition","Scene transition","select",[["punch","Punch zoom"],["flash","Flash"],["fade","Fade"],["cut","Hard cut"]]],
  ["h","Brand"],
  ["showHook","Show hook title at the start","toggle"],

  explain(status, j, model){

function parseJSON(t){

}
function pcmToBuffer(b64, rate){
  const bin = atob(b64); const n = bin.length >> 1; const buf = getAC().createBuffer(1, Math.max(1, n), rate); const ch = buf.getChannelData(0);

}

  ws(0,"RIFF"); v.setUint32(4, 36+len*2, true); ws(8,"WAVE"); ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);

  for (let i = 0; i < len; i++) v.setInt16(44 + i*2, clamp(data[i], -1, 1) * 0x7fff, true);
  return new Blob([ab], {type:"audio/wav"});
}

      const line = sen[i] || sen[sen.length - 1] || "";

        motion:m.type === "image" ? ["zoom-in","zoom-out","pan-left","pan-right"][i % 4] : "none"});
    }

      format:["Versus","POV","Countdown","Story","Challenge"][k], storyline:beats.length ? beats : ["Hook","Build","Payoff"],

      voiceover:"[Demo draft in " + P.language + "] " + beats.map(b => b + ".").join(" "),

  tts(text, voice){
    // Speech-like placeholder: one soft tone per word at ~2.5 words per second, pitch set by the voice.
    const ws = words(text), rate = 24000, wd = 0.3, gap = 0.1, n = Math.ceil((ws.length * (wd + gap) + 0.3) * rate);

    return buf;

async function addFiles(files){
  const box = $("#mediaMsg"); if (box){ box.hidden = false; box.className = "msg"; box.textContent = "Reading " + files.length + " file(s)…"; }
  for (const f of files){
    try {
      if (f.type.startsWith("video/")) S.media.push(await loadVideo(f));
      else if (f.type.startsWith("image/")) S.media.push(await loadImage(f));
    } catch (e) { toast("Couldn't read " + f.name); }
  }
  S.dirty = true; renderMedia(); if (box) box.hidden = true;
}
async function loadVideo(f){
  const url = URL.createObjectURL(f); const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
  await once(v, "loadedmetadata");
  if (!isFinite(v.duration) || !v.videoWidth) throw new Error("bad video");
  await seek(v, Math.min(0.5, v.duration/2));
  return {id:uid(), name:f.name, type:"video", url, dur:v.duration, w:v.videoWidth, h:v.videoHeight, thumb:snap(v, v.videoWidth, v.videoHeight, 200, 0.7)};
}
async function loadImage(f){
  const url = URL.createObjectURL(f); const img = new Image(); img.src = url;
  await img.decode();
  return {id:uid(), name:f.name, type:"image", url, img, dur:0, w:img.naturalWidth, h:img.naturalHeight, thumb:snap(img, img.naturalWidth, img.naturalHeight, 200, 0.7)};
}
function snap(src, sw, sh, maxW, q){
  const s = Math.min(1, maxW / Math.max(sw, sh)); const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(sw*s)); c.height = Math.max(1, Math.round(sh*s));
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q);
}
async function framesFor(m, n){
  if (m.type === "image"){ return [{t:0, b64:snap(m.img, m.w, m.h, 512, 0.72).split(",")[1]}]; }
  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = m.url;
  await once(v, "loadeddata");
  const out = [];
  for (let i = 0; i < n; i++){
    const t = n === 1 ? m.dur/2 : clamp((m.dur - 0.2) * (i + 0.5) / n, 0, m.dur);
    await seek(v, t); out.push({t:r1(t), b64:snap(v, m.w, m.h, 448, 0.68).split(",")[1]});
  }
  v.removeAttribute("src"); v.load(); return out;
}

/* ============ views ============ */
function go(view){
  S.view = view;
  for (const v of ["projects","setup","ideas","create","settings"]) $("#v-" + v).hidden = v !== view;
  document.querySelectorAll(".tab").forEach(b => { if (b.dataset.go === (view === "setup" ? "projects" : view)) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (view !== "create" && S.renderer && S.renderer.running && !S.renderer.recording) S.renderer.stop();
  ({projects:renderProjects, setup:renderSetup, ideas:renderIdeas, create:renderCreate, settings:renderSettings})[view]();
  window.scrollTo(0, 0);
}
function demoNote(){
  if (!AI.demo()) return "";
  return '<div class="msg" id="demoNote"><b>Demo mode.</b> AI steps are simulated on this device, and the voice-over is a placeholder tone. <button class="btn small ghost" data-go="settings">Add Gemini key</button></div>';
}
function renderSel(){
  const sel = $("#projSel");
  sel.innerHTML = S.projects.length ? S.projects.map(p => '<option value="' + p.id + '"' + (p.id === S.pid ? " selected" : "") + ">" + esc(p.name) + "</option>").join("") : '<option value="">No projects yet</option>';
  sel.disabled = !S.projects.length;
}

let saveT;

  const key = AI.key();
  $("#settingsBox").innerHTML = '<div><span class="eyebrow">Settings</span><h2>Free AI setup</h2><p class="lead">Reelwala uses Google\'s Gemini API free tier to watch your clips, write stories and generate voices. The key stays on this device.</p></div>' +
    '<div class="msg ' + (AI.demo() ? "" : "good") + '" id="modeMsg">' + (AI.demo() ? (FORCE_DEMO ? "Demo mode is forced by the ?demo=1 link." : "Demo mode: no key yet, so AI steps are simulated.") : ("Real AI is on" + (String(CFG.GEMINI_API_KEY || "").startsWith("YOUR_") ? " (key saved in this browser)." : " (key from config.js).")) ) + '</div>' +
    '<div class="panel"><h3>Get your free key</h3><ol class="steps"><li>Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> and sign in with Google.</li><li>Tap <b>Create API key</b> and copy it.</li><li>Paste it below and tap <b>Save and test</b>.</li></ol>' +
    '<label class="f" for="keyIn">Gemini API key<input type="password" id="keyIn" autocomplete="off" value="' + esc(key) + '" placeholder="AIza…"></label>' +
    '<div class="row"><button class="btn primary" data-act="save-key">Save and test</button>' + (LS.get("rw_key","") ? '<button class="btn small ghost danger" data-act="clear-key">Remove key</button>' : "") + '<span class="note" id="keyMsg"></span></div></div>' +
    '<div class="panel"><h3>Models</h3><p class="note" style="margin:0">Defaults work on the free tier. If you hit “free limit reached”, switch to another model here.</p>' +
    '<label class="f" for="tmIn">Story and planning model<input type="text" id="tmIn" list="tmList" value="' + esc(AI.textModel()) + '"></label><datalist id="tmList"></datalist>' +
    '<label class="f" for="vmIn">Voice (text-to-speech) model<input type="text" id="vmIn" list="vmList" value="' + esc(AI.ttsModel()) + '"></label><datalist id="vmList"></datalist>' +
    '<div class="row"><button class="btn small" data-act="save-models">Save models</button></div></div>' +
    '<div class="panel"><h3>Backup</h3><p class="note" style="margin:0">Projects and ideas are stored in this browser. Export a backup to move them to another device.</p>' +
    '<div class="row"><button class="btn small" data-act="export-json">Export backup</button><label class="btn small" for="importIn">Import backup<input type="file" id="importIn" accept="application/json,.json" hidden></label></div></div>' +
    '<div class="panel"><h3>Good to know</h3><ul class="steps" style="padding-left:18px"><li>Free-tier requests may be used by Google to improve its products. Don\'t upload private footage.</li><li>The AI only edits what you upload. It doesn\'t generate new video.</li><li>Clips are processed on this device and never leave it, except for small preview frames sent to Gemini for planning.</li></ul></div>';
}
async function testKey(){
  const msg = $("#keyMsg"); LS.set("rw_key", $("#keyIn").value.trim()); msg.innerHTML = '<span class="spin"></span> Testing…';
  try {
    const ms = await AI.models();
    const text = ms.filter(m => /gemini/.test(m) && !/tts|image|embed|live|audio|veo|imagen/.test(m));
    const tts = ms.filter(m => /tts/.test(m));
    if (!text.includes(AI.textModel())){ const pick = text.find(m => /^gemini-2\.5-flash$/.test(m)) || text.find(m => /flash/.test(m) && !/lite|preview/.test(m)) || text[0]; if (pick) LS.set("rw_text_model", pick); }
    if (tts.length && !tts.includes(AI.ttsModel())){ const pick = tts.find(m => /flash/.test(m)) || tts[0]; LS.set("rw_tts_model", pick); }
    renderSettings();
    $("#tmList").innerHTML = text.map(m => '<option value="' + esc(m) + '">').join(""); $("#vmList").innerHTML = tts.map(m => '<option value="' + esc(m) + '">').join("");
    $("#keyMsg").textContent = "Key works. " + text.length + " text models and " + tts.length + " voice models available."; $("#keyMsg").style.color = "var(--good)";
  } catch (e) { msg.textContent = e.message; msg.style.color = "var(--bad)"; }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({app:"reelwala", v:1, projects:S.projects, ideas:S.ideas}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "reelwala-backup.json"; document.body.appendChild(a); a.click(); a.remove();
}
async function importJSON(f){
  try { const j = JSON.parse(await f.text()); if (j.app !== "reelwala") throw 0;
    for (const p of j.projects || []){ if (!S.projects.find(x => x.id === p.id)) S.projects.push(p); await DB.put("projects", p); }
    for (const d of j.ideas || []){ if (!S.ideas.find(x => x.id === d.id)) S.ideas.push(d); await DB.put("ideas", d); }
    if (!cur() && S.projects[0]) setPid(S.projects[0].id); renderSel(); toast("Backup imported");
  } catch { toast("That file isn't a Reelwala backup."); }
}

/* ============ events ============ */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-act]"); if (!t) return;
  if (t.dataset.go){ go(t.dataset.go); return; }
  const a = t.dataset.act, id = t.dataset.id, i = +t.dataset.i;
  if (a !== "del") S.delArm = null;
  switch (a){
    case "new": newProject(+t.dataset.tpl); break;
    case "open-setup": setPid(id); go("setup"); break;
    case "open-ideas": setPid(id); go("ideas"); break;
    case "open-create": setPid(id); go("create"); break;
    case "dup": { const p = S.projects.find(x => x.id === id); const c = {...JSON.parse(JSON.stringify(p)), id:uid(), name:p.name + " copy", created:Date.now()}; S.projects.push(c); await DB.put("projects", c); renderSel(); renderProjects(); break; }
    case "del": if (S.delArm !== id){ S.delArm = id; renderProjects(); break; }
      S.projects = S.projects.filter(x => x.id !== id); await DB.del("projects", id);
      for (const d of S.ideas.filter(x => x.pid === id)) await DB.del("ideas", d.id); S.ideas = S.ideas.filter(x => x.pid !== id);
      S.delArm = null; if (S.pid === id) setPid(S.projects[0] ? S.projects[0].id : ""); renderSel(); renderProjects(); toast("Project deleted"); break;
    case "sample-voice": sampleVoice(); break;
    case "gen-ideas": genIdeas(); break;
    case "star-idea": { const d = S.ideas.find(x => x.id === id); d.starred = d.starred ? 0 : 1; await DB.put("ideas", d); renderIdeas(); break; }
    case "del-idea": S.ideas = S.ideas.filter(x => x.id !== id); await DB.del("ideas", id); renderIdeas(); break;
    case "use-idea": useIdea(id); break;
    case "clear-idea": S.ideaNote = ""; renderCreate(); break;
    case "del-media": S.media.splice(i, 1); if (S.plan){ S.plan.scenes = S.plan.scenes.filter(s => s.mediaIdx !== i).map(s => ({...s, mediaIdx:s.mediaIdx > i ? s.mediaIdx - 1 : s.mediaIdx})); } S.dirty = true; renderCreate(); break;
    case "expand-story": expandStory(); break;
    case "plan": S.story = $("#storyIn").value; makePlan(); break;
    case "quick": S.story = $("#storyIn").value; quickPlan(); break;
    case "up": case "down": { const sc = S.plan.scenes, j = a === "up" ? i - 1 : i + 1; if (j < 0 || j >= sc.length) break; [sc[i], sc[j]] = [sc[j], sc[i]]; S.dirty = true; renderPlan(); break; }
    case "del-scene": S.plan.scenes.splice(i, 1); S.dirty = true; renderPlan(); updateTotals(); break;
    case "add-scene": S.plan.scenes.push({mediaIdx:0, start:0, dur:2.5, caption:"", voice:"", motion:S.media[0] && S.media[0].type === "image" ? "zoom-in" : "none"}); S.dirty = true; renderPlan(); updateTotals(); break;
    case "vo-mode": S.voMode = t.dataset.v; document.querySelectorAll('[data-act="vo-mode"]').forEach(b => b.setAttribute("aria-pressed", b === t)); if (S.voMode === "none" && S.vo){ S.vo = null; S.dirty = true; } renderVO(); break;
    case "gen-vo": genVO(); break;
    case "rec": toggleRec(); break;
    case "fit-vo": syncToVO(); renderPlan(); updateTotals(); toast("Scene lengths fitted to the voice-over"); break;
    case "del-vo": S.vo = null; S.dirty = true; renderVO(); break;
    case "del-music": S.music = null; S.dirty = true; renderCreate(); break;
    case "play": preview(); break;
    case "stop": if (S.renderer) S.renderer.stop(); tick(0, 1); break;
    case "export": exportVideo(); break;
    case "share": share(); break;
    case "copy-cap": { const v = $("#postCap").value; try { await navigator.clipboard.writeText(v); toast("Caption copied"); } catch { $("#postCap").select(); toast("Selected. Copy it from the menu."); } break; }
    case "save-key": testKey(); break;
    case "clear-key": try { localStorage.removeItem("rw_key"); } catch {} renderSettings(); toast("Key removed. Demo mode is on."); break;
    case "save-models": LS.set("rw_text_model", $("#tmIn").value.trim() || "gemini-2.5-flash"); LS.set("rw_tts_model", $("#vmIn").value.trim() || "gemini-2.5-flash-preview-tts"); toast("Models saved"); break;
    case "export-json": exportJSON(); break;
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.closest("#setupForm")) return onSetupInput(e);
  if (el.id === "storyIn"){ S.story = el.value; return; }
  if (el.id === "hookIn"){ S.plan.hook = el.value; S.dirty = true; return; }
  if (el.id === "musicVol"){ S.musicVol = +el.value; S.dirty = true; return; }
  if (el.id === "postCap") return;
  const f = el.dataset.f, row = el.closest(".scene");
  if (f && row && S.plan){
    const s = S.plan.scenes[+row.dataset.i]; let v = el.value;
    if (f === "start" || f === "dur") v = Math.max(f === "dur" ? 0.3 : 0, parseFloat(v) || 0);
    s[f] = v; S.dirty = true; if (f === "dur" || f === "start") updateTotals();
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "projSel"){ setPid(el.value); go(S.view === "settings" ? "projects" : S.view); return; }
  if (el.id === "fileIn"){ await addFiles([...el.files]); el.value = ""; return; }
  if (el.id === "musicIn" && el.files[0]){ try { S.music = {name:el.files[0].name, buffer:await getAC().decodeAudioData(await el.files[0].arrayBuffer())}; S.dirty = true; renderCreate(); } catch { toast("Couldn't read that audio file."); } return; }
  if (el.id === "voIn" && el.files[0]){ try { setVO(await getAC().decodeAudioData(await el.files[0].arrayBuffer()), "upload"); toast("Voice-over added"); } catch { toast("Couldn't read that audio file."); } return; }
  if (el.id === "importIn" && el.files[0]){ importJSON(el.files[0]); return; }
  if (el.id === "voVoice"){ S.voVoice = el.value; return; }
  if (el.id === "safeT"){ S.safe = el.checked; if (S.renderer && S.renderer.ready && !S.renderer.running) S.renderer.draw(0); return; }
  if (el.id === "qual"){ S.dirty = true; return; }
  const f = el.dataset.f, row = el.closest(".scene");
  if (f === "mediaIdx" && row){ const s = S.plan.scenes[+row.dataset.i]; s.mediaIdx = +el.value; const m = S.media[s.mediaIdx]; if (m.type === "image") s.start = 0; S.dirty = true; renderPlan(); }
});

/* ============ boot ============ */
(async function boot(){
  await DB.open();
  S.projects = (await DB.all("projects")).sort((a, b) => (a.created || 0) - (b.created || 0));
  S.ideas = await DB.all("ideas");
  if (!cur() && S.projects[0]) S.pid = S.projects[0].id;
  renderSel();
  go("projects");
})();
</script>
</body>
</html>
