<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reelwala</title>
<meta name="theme-color" content="#F5F3F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@700;800&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Montserrat:wght@800&family=Mukta:wght@700;800&family=Poppins:wght@600;800&display=swap">
<style>
/* Layout: one phone-width column, sticky top bar with project switcher, fixed bottom tab bar. Cards only for scenes, ideas and projects. */
:root{
  --bg:#F5F3F2; --surface:#FFFFFF; --sunk:#ECE8E6; --ink:#17151A; --muted:#6B6570; --line:#E2DDDA;
  --accent:#E8492A; --accent-ink:#FFFFFF; --soft:#FBE7E1; --good:#1F7A52; --warn:#9A6514; --bad:#B42318;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121014; --surface:#1C191F; --sunk:#262229; --ink:#F3EFF1; --muted:#A59DA8; --line:#322C35;
    --accent:#FF6A48; --accent-ink:#1A0D09; --soft:#3A1E17; --good:#5CC995; --warn:#E3B05C; --bad:#FF8A80; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;white-space:nowrap}
.rec{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.top select{margin-left:auto;max-width:56%;min-width:0}
main .wrap{padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
.lead{color:var(--muted);margin:4px 0 0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;min-height:42px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f .hint{font-weight:400;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:baseline;gap:10px}
.step .n{font:500 12px/1 var(--mono);color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:4px 6px}
.chip{font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--muted);white-space:nowrap}
.chip.hot{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--sunk)}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.msg.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.sec-h{font:700 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:10px;padding-top:14px;border-top:1px dashed var(--line)}
.sec-h:first-child{border-top:0;margin-top:0;padding-top:0}
.form{display:flex;flex-direction:column;gap:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14px}
.toggle input{width:44px;height:26px;appearance:none;background:var(--sunk);border:1px solid var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0003;transition:left .15s}
.toggle input:checked{background:var(--accent);border-color:var(--accent)}
.toggle input:checked::after{left:20px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:52px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}

/* projects */
.cards{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcard .stripe{height:6px}
.pcard .in{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pcard p{margin:0;color:var(--muted);font-size:14px}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px}
.tpl button b{font-family:var(--display);font-size:16px}
.tpl button span{font-size:13px;color:var(--muted)}

/* media */
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.mi{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--sunk);max-width:100%}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mi .tag{position:absolute;left:5px;top:5px;font:500 10px/1 var(--mono);background:#000a;color:#fff;border-radius:4px;padding:3px 4px}
.mi .dur{position:absolute;left:5px;bottom:5px;font:500 10px/1 var(--mono);background:#000a;color:#fff;border-radius:4px;padding:3px 4px}
.mi .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer;font-size:15px;line-height:1}
.drop{border:1.5px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:var(--soft);color:var(--ink);font-weight:600}

/* scenes */
.scenes{display:flex;flex-direction:column;gap:10px}
.scene{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.scene .hd{display:flex;gap:10px;align-items:flex-start}
.scene .th{width:46px;flex:none;aspect-ratio:9/16;border-radius:7px;overflow:hidden;background:var(--sunk)}
.scene .th img{width:100%;height:100%;object-fit:cover;display:block}
.scene .meta{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.scene .meta label{font:500 10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.scene .meta select,.scene .meta input{min-height:34px;padding:5px 7px;font:14px var(--body)}
.scene .tc{font:500 12px/1 var(--mono);color:var(--accent)}
.scene textarea{min-height:56px}
.scene .ops{display:flex;gap:4px;margin-left:auto}
.iconb{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.total{font:500 13px/1 var(--mono)}

/* preview */
.stage{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.screen{width:min(100%,300px);aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen canvas,.screen video{width:100%;height:100%;display:block}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.tcbig{font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums}

/* ideas */
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.idea .hook{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25}
.idea ol,.idea ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.idea details summary{cursor:pointer;font-weight:600;font-size:14px}
.idea .vo,.reel .vo{white-space:pre-wrap;font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:6px}
.star{color:var(--accent)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prompter{font-size:20px;line-height:1.45;background:var(--sunk);border-radius:12px;padding:14px;max-height:220px;overflow:auto;white-space:pre-wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.btn{transition:none}}
a{color:var(--accent)}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.strip img{width:38px;aspect-ratio:9/16;object-fit:cover;border-radius:5px;flex:none;background:var(--sunk)}
.reel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px}
.reel.posted{opacity:.72}
.reel .when{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reel .when input{width:auto;min-height:34px;padding:4px 8px;font:500 13px var(--mono)}
.chip.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.mini{width:min(100%,180px);aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden}
.mini canvas,.mini video{width:100%;height:100%;display:block}
.top .wrap.sub{padding-block:0 8px;gap:8px}
.top .sub select{margin-left:0;max-width:none;flex:1;min-height:36px;padding:5px 10px;font-size:14px}
.top #pageSel{font-weight:600}
.gear{flex:none;display:grid;place-items:center;width:38px;height:38px}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:360px){.logo .wm{display:none}}
details.panel summary{cursor:pointer}
.slides{display:flex;flex-direction:column;gap:10px}
.slide{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.slide canvas.spv{width:108px;height:auto;flex:none;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.slide .sf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.slide textarea{min-height:70px}
canvas.pthumb{width:64px;height:auto;flex:none;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.pfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pfiles img{width:100%;border-radius:8px;display:block;box-shadow:0 0 0 1px var(--line)}
.claim{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.tele{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tele-in{padding-block:18px;display:flex;flex-direction:column;gap:12px}
.tele.cam{background:#000;color:#fff;overflow:hidden}
.tele.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tele.cam video.mirror{transform:scaleX(-1)}
.tele-script{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:40%;overflow:hidden;background:linear-gradient(rgba(0,0,0,.74),rgba(0,0,0,.4));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tele-script p{margin:0 auto;max-width:640px;line-height:1.42;font-weight:600;text-align:center}
.tele-pad{height:16vh}
.tele-count{position:absolute;inset:0;display:grid;place-items:center;font:800 120px var(--display);color:#fff;text-shadow:0 4px 30px #000}
.tele-bar{position:absolute;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;flex-direction:column;gap:8px}
.tele-bar .f{color:#fff;font-size:12px}
.tele-bar .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.recbtn{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#E8492A;cursor:pointer;flex:none;transition:border-radius .2s,transform .2s}
.recbtn.on{border-radius:20px;transform:scale(.82)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
code{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo"><span class="rec" aria-hidden="true"></span><span class="wm">Reelwala</span></div>
  <select id="pageSel" aria-label="Instagram page"></select>
  <button class="iconb gear" data-go="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div><div class="wrap sub" id="projBar" hidden><label for="projSel" class="eyebrow">Project</label><select id="projSel"></select></div></header>

<main>
<section id="v-projects"><div class="wrap" id="projectsBox"></div></section>
<section id="v-setup" hidden><div class="wrap" id="setupBox"></div></section>
<section id="v-ideas" hidden><div class="wrap" id="ideasBox"></div></section>
<section id="v-posts" hidden><div class="wrap" id="postsBox"></div></section>
<section id="v-series" hidden><div class="wrap" id="seriesBox"></div></section>
<section id="v-create" hidden><div class="wrap" id="createBox"></div></section>
<section id="v-settings" hidden><div class="wrap" id="settingsBox"></div></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button class="tab" data-go="projects"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l2 5M14 4l2 5"/></svg>Projects</button>
  <button class="tab" data-go="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>Ideas</button>
  <button class="tab" data-go="posts"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Posts</button>
  <button class="tab" data-go="series"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M7 17h3M14 14h3"/></svg>Series</button>
  <button class="tab" data-go="create"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z"/></svg>Create</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
"use strict";
/* ============ constants ============ */
const BASE = "https://generativelanguage.googleapis.com/v1beta";
const STRUCTURES = {
  hook:["Hook → Build → Payoff","Open with the most surprising moment as a hook. Set up the situation in one line. Build with 2–4 escalating moments. Land the payoff or punchline. End with a question or call to action."],
  versus:["Versus / Challenge","Cold open on the most dramatic moment. Introduce the competitors and the challenge rules. Round-by-round highlights with a running score. A twist, blunder or comeback. Final result and the winner's reaction. Tease next week's challenge."],
  beforeafter:["Before → After","Flash the end result for 1 second as a hook. Cut to the 'before'. Show 3–5 quick steps of the process. Reveal the full 'after'. End with the key tip."],
  countdown:["Top N countdown","Hook stating what the list is. Count down from N to 1, one item per scene with a one-line reason. Number 1 gets the longest scene. End by asking viewers for their pick."],
  dayinlife:["Day in the life","Hook with the most interesting moment of the day. Then go chronological: morning, main activity, a funny or real moment, evening wind-down. Close with one reflection line."],
  tutorial:["How-to / Tutorial","Hook with the result and a promise (\"do this in 30 seconds\"). Steps 1–N, one per scene, each with a clear caption. One common mistake to avoid. Final result. Ask viewers to save the reel."],
  travel:["Travel diary","Hook with the best view. Arrival moment. 3–4 highlights, each with one interesting fact or tip. A food moment. Closing reflection plus one practical tip (cost, timing or route)."],
  herb:["Herb spotlight","Hook with a surprising fact about the herb or spice. Its common and Sanskrit name and its taste. 2–3 ways Ayurveda traditionally uses it. One simple way to use it at home. Who should be careful with it. Ask viewers to save the reel."],
  dosha:["Dosha explainer","Hook with a relatable question (\"Always cold and anxious?\"). Name the dosha and its qualities in one line. 3 signs it may be out of balance. 2–3 simple things that help balance it (food, routine). What makes it worse. Invite viewers to comment their dosha."],
  myth:["Myth vs fact","Show the myth on screen as the hook. Say clearly whether it's true. What classical Ayurveda actually says. One practical takeaway. Ask viewers which myth to bust next."],
  ritual:["Daily ritual","Hook with the result or feeling. Name the ritual (Sanskrit name and meaning). Show the steps, one per scene. When and how often to do it. One common mistake. Call to action."],

  ttsModel(){ return LS.get("rw_tts_model", CFG.TTS_MODEL || "gemini-2.5-flash-preview-tts"); },
  explain(status, j, model){
    const m = (j && j.error && j.error.message) || "";
    if (status === 400 && /api key/i.test(m)) return "That API key isn't valid. Paste a fresh key in Settings.";
    if (status === 429) return "Free limit reached for " + model + ". Wait a minute and try again, or choose another model in Settings.";
    if (status === 404) return "The model " + model + " isn't available for your key. Choose another one in Settings.";
    if (status === 403) return "Your key isn't allowed to use " + model + ". Check the key in Google AI Studio.";
    return (m || ("Request failed (" + status + ").")) ;
  },
  async call(model, body){

    for (let attempt = 0; attempt < 2; attempt++){
      let r;

        r = await fetch(BASE + "/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(key),
          {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});

      let j = null; try { j = await r.json(); } catch {}
      if (r.ok) return j;

      throw new Error(this.explain(r.status, j, model));

  async json(prompt, images = [], mock = null){
    if (this.demo() && mock){ await new Promise(r => setTimeout(r, 500)); return mock(); }

    const j = await this.call(this.textModel(), {contents:[{role:"user", parts}], generationConfig:{responseMimeType:"application/json", temperature:0.9}});

    if (!txt) throw new Error((c && c.finishReason === "SAFETY") ? "Gemini declined this request. Try rewording the story." : "Gemini returned an empty answer. Try again.");

function parseJSON(t){
  t = t.replace(/^\s*```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b+1)); } catch {} }
  throw new Error("Gemini's answer wasn't in the expected format. Tap the button again.");
}
function pcmToBuffer(b64, rate){
  const bin = atob(b64); const n = bin.length >> 1; const buf = getAC().createBuffer(1, Math.max(1, n), rate); const ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++){ let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8); if (v >= 32768) v -= 65536; ch[i] = v / 32768; }
  return buf;
}
function bufToWav(buf){
  const data = buf.getChannelData(0), len = data.length, ab = new ArrayBuffer(44 + len*2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,"RIFF"); v.setUint32(4, 36+len*2, true); ws(8,"WAVE"); ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate*2, true); v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40, len*2, true);
  for (let i = 0; i < len; i++) v.setInt16(44 + i*2, clamp(data[i], -1, 1) * 0x7fff, true);
  return new Blob([ab], {type:"audio/wav"});
}

const Mock = {

  beats(P){ return P.structure.split(/(?<=\.)\s+/).map(x => x.replace(/\.$/, "").trim()).filter(Boolean); },
  plan(P, media = S.media, story = S.story){
    const sen = this.sentences(story); const n = Math.max(media.length, Math.min(sen.length, media.length * 2), 1);
    const per = P.duration / n; const scenes = [];
    for (let i = 0; i < n; i++){
      const mi = i % media.length, m = media[mi]; const reuse = Math.floor(i / media.length);
      const dur = m.type === "video" ? Math.min(per, m.dur) : clamp(per, 1.5, 4);
      const start = m.type === "video" ? r1(Math.min(reuse * dur, Math.max(0, m.dur - dur))) : 0;
      const line = sen[i] || sen[sen.length - 1] || "";
      scenes.push({media:mi, start, end:start + dur, caption:words(line).slice(0, 7).join(" "), voice:P.voMode === "none" ? "" : line,
        motion:m.type === "image" ? ["zoom-in","zoom-out","pan-left","pan-right"][i % 4] : "none"});
    }

  },
  ideas(P, hint, offset){

    const angles = ["The unexpected twist","Behind the scenes","Rookie vs pro","One-take challenge","The rematch","Fan's choice","Speed round","Worst to best"];
    return {ideas:[0,1,2,3,4].map(k => { const a = angles[(k + offset) % angles.length]; return {
      title:a + ": " + topic, hook:"Open on the most dramatic second, text on screen: \u201c" + a + "\u201d",
      format:["Versus","POV","Countdown","Story","Challenge"][k], storyline:beats.length ? beats : ["Hook","Build","Payoff"],

      voiceover:"[Demo draft in " + P.language + "] " + beats.map(b => b + ".").join(" "),

  },
  story(P, story){ const b = this.beats(P); const sen = this.sentences(story);
    return {story:b.map((x, i) => x + (sen[i] ? ": " + sen[i] : "")).join("\n")}; },
  tts(text, voice){
    // Speech-like placeholder: one soft tone per word at ~2.5 words per second, pitch set by the voice.
    const ws = words(text), rate = 24000, wd = 0.3, gap = 0.1, n = Math.ceil((ws.length * (wd + gap) + 0.3) * rate);

/* ============ media ============ */

/* ============ plan ============ */
async function buildPlan(P, media, story, note, onStatus){

    const n = m.type === "video" ? clamp(Math.round(m.dur / 2), 2, per) : 1;
    const fr = await framesFor(m, n);
    fr.forEach(f => images.push({label: m.type === "video" ? ("Media #" + i + " (video) frame at " + f.t + "s:") : ("Media #" + i + " (photo):"), b64:f.b64}));
  }
  if (onStatus) onStatus("Writing the story and edit plan…");
  const list = media.map((m, i) => "#" + i + " " + (m.bg ? "designed background, no footage" : m.type === "video" ? "video, " + r1(m.dur) + "s" : "photo") + ", " + (m.h >= m.w ? "portrait" : "landscape")).join("\n");
  const prompt = "You are a short-form video editor and scriptwriter. Build an edit plan for one Instagram " + (P.kind === "story" ? "Story" : "Reel") + " using ONLY the media provided.\n\n" +
    brief(P) + "\n\nSTORY FROM THE CREATOR:\n" + story.trim() + (note ? "\n\nIDEA NOTES:\n" + note : "") +
    "\n\nMEDIA (reference these indexes):\n" + list + "\nFrames from each media item follow, labelled with the media index and timestamp.\n\n" +
    "RULES:\n- The scene durations should add up to about " + P.duration + " seconds (within 15%).\n" +
    "- Each scene uses one media index. For a video, choose start and end seconds inside the clip that show the moment you need (use the frame timestamps). For a photo, use start 0 and end = how long to show it (1.5–4 s).\n" +
    "- You may reuse a video at different moments. Order scenes to follow the story structure. Open on the strongest visual.\n" +
    "- caption: on-screen text, max 7 words, " + capRule(P) + ".\n" +
    (P.voMode === "none" ? "- voice: leave empty for every scene (no voice-over).\n" : "- voice: the voice-over spoken during that scene, in " + P.language + ", roughly 2.5 words per second of the scene. Together the lines must tell the story.\n") +
    (media.every(m => m.bg) ? "- There is no footage: every scene is a plain designed background, so the on-screen captions carry the content. Make each caption a complete, readable line (max 10 words).\n" : "") +
    "- motion: for photos one of zoom-in, zoom-out, pan-left, pan-right. For videos none or zoom-in.\n" +
    "- hook: punchy title shown in the first 2 seconds, max 6 words, " + capRule(P) + ".\n" +
    "- post_caption: the Instagram post caption, 1–3 short lines ending in a question that invites comments.\n" +
    "- hashtags: 8–12 relevant hashtags.\n\n" +

  const j = await AI.json(prompt, images, () => Mock.plan(P, media, story));

  return plan;
}
async function makePlan(){

  S.planBusy = true; renderPlan();
  try {

    S.vo = null; S.dirty = true; S.claims = null; toast("Plan ready: " + S.plan.scenes.length + " scenes");

    cx.fillStyle = P.brand; rrect(cx, (W - bw)/2, yc - bh/2, bw, bh, fs*0.25); cx.fill();
    cx.fillStyle = "#fff"; cx.textAlign = "center";
    lines.forEach((l, i) => cx.fillText(l.join(" "), W/2, yc - (lines.length - 1)*lh/2 + i*lh));
    cx.restore();
  }
  drawEnd(lt){
    const {cx, W, H, P} = this; const a = clamp(lt/0.35, 0, 1);
    cx.fillStyle = "#000"; cx.fillRect(0, 0, W, H); cx.globalAlpha = a; cx.fillStyle = P.brand; cx.fillRect(0, 0, W, H);
    const g = cx.createRadialGradient(W/2, H*0.45, W*0.1, W/2, H*0.5, H*0.7); g.addColorStop(0, "rgba(255,255,255,0.12)"); g.addColorStop(1, "rgba(0,0,0,0.35)"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillStyle = "#fff";
    const handle = P.handle || P.name; let fs = W*0.085; cx.font = fontStr(P.font, fs); while (cx.measureText(handle).width > W*0.86 && fs > 20){ fs *= 0.9; cx.font = fontStr(P.font, fs); }
    cx.fillText(handle, W/2, H*0.45);
    if (P.cta){ const f2 = W*0.05; cx.font = fontStr(P.font, f2, false); const tw = cx.measureText(P.cta).width;
      cx.fillStyle = "rgba(255,255,255,0.95)"; rrect(cx, (W - tw)/2 - f2*0.9, H*0.55 - f2*0.95, tw + f2*1.8, f2*1.9, f2*0.95); cx.fill();
      cx.fillStyle = P.brand; cx.fillText(P.cta, W/2, H*0.55 + f2*0.02); }
    cx.globalAlpha = 1;
  }
  overlay(){
    if (!S.safe || this.recording) return; const {cx, W, H} = this;
    cx.save(); cx.fillStyle = "rgba(232,73,42,0.16)"; cx.fillRect(0, 0, W, H*0.14); cx.fillRect(0, H*0.8, W, H*0.2);
    cx.setLineDash([W*0.015, W*0.012]); cx.strokeStyle = "rgba(255,255,255,0.7)"; cx.lineWidth = W*0.003;
    cx.beginPath(); cx.moveTo(0, H*0.14); cx.lineTo(W, H*0.14); cx.moveTo(0, H*0.8); cx.lineTo(W, H*0.8); cx.stroke();
    cx.font = "500 " + Math.round(W*0.026) + 'px "JetBrains Mono", monospace'; cx.fillStyle = "rgba(255,255,255,0.85)"; cx.textAlign = "left"; cx.textBaseline = "top";
    cx.fillText("INSTAGRAM TOP BAR", W*0.03, H*0.14 - W*0.045); cx.fillText("CAPTION + BUTTONS ZONE", W*0.03, H*0.8 + W*0.015);
    cx.restore();
  }
}

function scheduleDates(start, freq, n){
  const out = []; let d = new Date(start + "T00:00");
  if (isNaN(d)) d = new Date();
  if (freq === "mwf") while (![1,3,5].includes(d.getDay())) d.setDate(d.getDate() + 1);
  for (let i = 0; i < n; i++){
    out.push(isoDay(d));
    if (freq === "daily") d.setDate(d.getDate() + 1);
    else if (freq === "every2") d.setDate(d.getDate() + 2);
    else if (freq === "weekly") d.setDate(d.getDate() + 7);
    else { do { d.setDate(d.getDate() + 1); } while (![1,3,5].includes(d.getDay())); }
  }
  return out;
}

const CLAIM_RULES = [
  [/\b(cures?|cured|curing)\b/gi, "supports", "Saying something cures a condition is a medical claim. Describe traditional use instead."],
  [/\b(treats?|treated|treating)\b/gi, "is traditionally used for", "Treatment claims need medical evidence. Describe traditional use instead."],
  [/\b(heals?|healed|healing)\b/gi, "soothes", "“Heals” reads as a medical promise."],
  [/\b(guaranteed?|100\s?%)/gi, "often", "Avoid guarantees. Results vary from person to person."],
  [/\bno side[- ]effects?\b/gi, "is generally well tolerated", "Every herb can cause side effects or interact with medicines."],
  [/\b(miracle|magic(al)?)\b/gi, "time-tested", "Miracle language makes content look unreliable and can break ad rules."],
  [/\b(instantly|overnight|permanently)\b/gi, "over time", "Promising instant or permanent results is misleading."],
  [/\b(diabetes|cancer|thyroid|pcos|pcod|hypertension|blood pressure|asthma|arthritis|infertility|depression|heart disease|kidney stones?|covid)\b/gi, null, "A named disease next to a remedy reads as a medical claim. Talk about general wellbeing, or tell viewers to consult a doctor."]

  return out;
}

  const W = chunks.reduce((a, c) => a + words(c).length, 0); const usable = Math.max(1, dur);

}

/* ============ designed backgrounds for text-only AI reels ============ */
function makeBackgrounds(n = 6){
  const P = proj(), base = P.brand; const out = [];
  const grain = document.createElement("canvas"); grain.width = grain.height = 128; const gx = grain.getContext("2d"); const id = gx.createImageData(128, 128);
  for (let k = 0; k < id.data.length; k += 4){ const v = Math.random() * 255; id.data[k] = id.data[k+1] = id.data[k+2] = v; id.data[k+3] = 14; } gx.putImageData(id, 0, 0);
  for (let i = 0; i < n; i++){
    const c = document.createElement("canvas"); c.width = 1080; c.height = 1920; const x = c.getContext("2d");
    const ang = (i * 47 % 180) * Math.PI / 180, dx = Math.cos(ang) * 1100, dy = Math.sin(ang) * 1900;
    const g = x.createLinearGradient(540 - dx/2, 960 - dy/2, 540 + dx/2, 960 + dy/2);
    g.addColorStop(0, mixHex(base, "#000000", 0.62 - (i % 3) * 0.08)); g.addColorStop(1, mixHex(base, i % 2 ? "#FFFFFF" : "#000000", i % 2 ? 0.08 : 0.25));
    x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
    for (let k = 0; k < 3; k++){ const cxp = ((i * 331 + k * 577) % 1080), cyp = ((i * 613 + k * 911) % 1920), r = 260 + ((i + k) * 97 % 320);
      const rg = x.createRadialGradient(cxp, cyp, 0, cxp, cyp, r); rg.addColorStop(0, "rgba(255,255,255,0.13)"); rg.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = rg; x.fillRect(0, 0, 1080, 1920); }
    x.fillStyle = x.createPattern(grain, "repeat"); x.fillRect(0, 0, 1080, 1920);
    out.push({id:uid(), name:"Background " + (i + 1), type:"image", bg:true, img:c, url:"", dur:0, w:1080, h:1920, thumb:snap(c, 1080, 1920, 200, 0.7)});
  }
  return out;
}

function icsDownload(name, events){
  const pad = n => String(n).padStart(2, "0"), now = new Date(), stamp = now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) + "T" + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + "00Z";
  const escI = t => String(t).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/[,;]/g, m => "\\" + m);
  const ev = events.map(e => { const tm = e.time || "19:00"; const end = new Date(e.date + "T" + tm); end.setMinutes(end.getMinutes() + 30);
    const fmt = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
    return ["BEGIN:VEVENT", "UID:" + e.uid + "@reelwala", "DTSTAMP:" + stamp, "DTSTART:" + fmt(new Date(e.date + "T" + tm)), "DTEND:" + fmt(end),
      "SUMMARY:" + escI(e.title), "DESCRIPTION:" + escI(e.desc || ""), "BEGIN:VALARM", "TRIGGER:-PT30M", "ACTION:DISPLAY", "DESCRIPTION:" + escI(e.title), "END:VALARM", "END:VEVENT"].join("\r\n"); });
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Reelwala//Posting plan//EN", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"})); a.download = slug(name) + "-posting-plan.ics"; document.body.appendChild(a); a.click(); a.remove();
  toast("Calendar file downloaded. Open it to add the reminders.");
}

    savePage(); return; }
  if (el.id === "ptopic"){ S.postDraft.topic = el.value; return; }
  if (el.dataset.sf){ const p = curPost(); const sl = p.slides[+el.dataset.i]; if (el.dataset.sf === "stype") sl.sticker = {...(sl.sticker || {}), type:el.value}; else if (el.dataset.sf === "stext") sl.sticker = {...(sl.sticker || {type:"none"}), text:el.value}; else sl[el.dataset.sf] = el.value; drawPreviews(+el.dataset.i); savePost(); return; }
  if (el.id === "pKicker"){ curPost().kicker = el.value; drawPreviews(0); savePost(); return; }
  if (el.id === "pCap"){ curPost().caption = el.value; savePost(); return; }
  if (el.id === "teleText"){ S.teleScript = el.value; return; }
  if (el.id === "teleSpeed"){ S.teleSpeed = +el.value; return; }
  if (el.id === "teleSize"){ S.teleSize = +el.value; const tp = $("#teleP"); if (tp) tp.style.fontSize = S.teleSize + "px"; return; }
  if (el.id === "origVol"){ S.origVolOverride = +el.value; S.dirty = true; return; }
  if (el.dataset.cpf){ const fm = S.planForm.formats, k = el.dataset.cpf; S.planForm.formats = el.checked ? [...new Set([...fm, k])] : fm.filter(x => x !== k); return; }
  if (el.id && el.id.startsWith("cp") && el.closest("#ideasBox")){ const map = {cpStart:"start", cpDays:"days", cpPer:"per", cpTime:"time", cpFocus:"focus"}; if (map[el.id]) S.planForm[map[el.id]] = el.value; return; }
  if (el.id === "storyIn"){ S.story = el.value; return; }
  if (el.id === "hookIn"){ S.plan.hook = el.value; S.dirty = true; return; }
  if (el.id === "musicVol"){ S.musicVol = +el.value; S.dirty = true; return; }
  if (el.id === "postCap") return;
  const f = el.dataset.f, row = el.closest(".scene");
  if (f && row && S.plan){
    const s = S.plan.scenes[+row.dataset.i]; let v = el.value;
    if (f === "start" || f === "dur") v = Math.max(f === "dur" ? 0.3 : 0, parseFloat(v) || 0);
    s[f] = v; S.dirty = true; if (f === "dur" || f === "start") updateTotals();
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "projSel"){ setPid(el.value); go(S.view === "settings" ? "projects" : S.view); return; }
  if (el.id === "pageSel"){ if (el.value === "__new"){ S.newPage = true; renderSel(); go("projects"); setTimeout(() => { const n = $("#npName"); if (n) n.focus(); }, 50); } else { setPage(el.value); go(["settings","setup"].includes(S.view) ? "projects" : S.view); } return; }
  if (el.id === "pcount"){ S.postDraft.count = +el.value; return; }
  if (el.id === "pstyle"){ S.postDraft.style = el.value; return; }
  if (el.id === "pSpons"){ curPost().sponsored = el.checked; drawPreviews(0); savePost(); return; }
  if (el.id === "pPosted"){ curPost().status = el.checked ? "posted" : "draft"; savePost(); return; }
  if (el.id === "pPhotos"){ const imgs = []; for (const f of el.files){ try { imgs.push(await loadImage(f)); } catch {} } S.postPhotos = imgs; drawPreviews(); S.postFiles = []; renderPosts(); return; }
  if (el.id === "teleFile" && el.files[0]){ const ta = $("#teleText"); if (ta) S.teleScript = ta.value; await addSelfVideo(el.files[0]); return; }
  if (el.id === "fileIn"){ await addFiles([...el.files]); el.value = ""; return; }
  if (el.id === "musicIn" && el.files[0]){ try { S.music = {name:el.files[0].name, buffer:await getAC().decodeAudioData(await el.files[0].arrayBuffer())}; S.dirty = true; renderCreate(); } catch { toast("Couldn't read that audio file."); } return; }
  if (el.id === "voIn" && el.files[0]){ try { setVO(await getAC().decodeAudioData(await el.files[0].arrayBuffer()), "upload"); toast("Voice-over added"); } catch { toast("Couldn't read that audio file."); } return; }
  if (el.id === "importIn" && el.files[0]){ importJSON(el.files[0]); return; }
  if (el.id === "bFiles"){ await addSeriesFiles([...el.files]); el.value = ""; return; }
  if (el.id === "reIn"){ await reattach([...el.files]); return; }
  if (el.dataset.bf){ const b = curBatch(); if (b){ b.reels[+el.dataset.i][el.dataset.bf] = el.value; await saveBatch(b); renderSeries(); } return; }
  if (el.id === "voVoice"){ S.voVoice = el.value; return; }
  if (el.id === "safeT"){ S.safe = el.checked; if (S.renderer && S.renderer.ready && !S.renderer.running) S.renderer.draw(0); return; }
  if (el.id === "qual"){ S.dirty = true; return; }
  const f = el.dataset.f, row = el.closest(".scene");
  if (f === "mediaIdx" && row){ const s = S.plan.scenes[+row.dataset.i]; s.mediaIdx = +el.value; const m = S.media[s.mediaIdx]; if (m.type === "image") s.start = 0; S.dirty = true; renderPlan(); }
});

/* ============ boot ============ */
(async function boot(){
  await DB.open();
  S.projects = (await DB.all("projects")).sort((a, b) => (a.created || 0) - (b.created || 0));
  S.ideas = await DB.all("ideas");
  S.batches = await DB.all("batches");
  S.pages = (await DB.all("pages")).sort((a, b) => (a.created || 0) - (b.created || 0));
  S.posts = await DB.all("posts"); S.plans = await DB.all("plans");
  if (!S.pages.length){
    const a = newPageObj("Travel & Sports", "general", (S.projects.find(p => p.handle) || {}).handle || "");
    const b = newPageObj("Ayurveda", "ayurveda", ""); b.created = a.created + 1;
    S.pages = [a, b]; await DB.put("pages", a); await DB.put("pages", b);
  }
  for (const p of S.projects) if (!p.pageId || !S.pages.some(g => g.id === p.pageId)){ p.pageId = S.pages[0].id; await DB.put("projects", p); }
  if (!S.pages.some(g => g.id === S.pageId)) S.pageId = S.pages[0].id;
  if (!cur()) S.pid = (pageProjects()[0] || {}).id || "";
  renderSel();
  go("projects");
})();
</script>
